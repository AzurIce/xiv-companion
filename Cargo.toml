[package]
name = "xiv-companion"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "xiv_companion"
crate-type = ["rlib", "cdylib"]

[features]
default = []
game-data = [
    "dep:anyhow",
    "dep:binrw",
    "dep:flate2",
    "dep:physis",
    "xiv-companion-data/game-data",
]
renderer = ["xiv-companion-render/renderer"]
render-test-support = ["renderer", "xiv-companion-render/test-support"]
web = [
    "game-data",
    "renderer",
    "dep:console_error_panic_hook",
    "dep:dioxus",
    "dep:gloo-net",
    "dep:gloo-timers",
    "dep:indexed-db",
    "dep:js-sys",
    "dep:raphael-simulator",
    "dep:raphael-solver",
    "dep:raw-window-handle",
    "dep:urlencoding",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:wgpu",
    "dep:dioxus-free-icons",
    "dep:dioxus-flow",
]
wasm = [
    "dep:raphael-simulator",
    "dep:raphael-solver",
    "dep:tsify",
    "tsify/js",
    "xiv-companion-data/wasm",
]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
binrw = { version = "0.15", optional = true }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"], optional = true }
physis = { git = "https://github.com/AzurIce/physis.git", optional = true }
raphael-simulator = { git = "https://github.com/KonaeAkira/raphael-rs.git", package = "raphael-sim", tag = "v0.28.4", optional = true }
raphael-solver = { git = "https://github.com/KonaeAkira/raphael-rs.git", package = "raphael-solver", tag = "v0.28.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tsify = { version = "0.5.6", default-features = false, optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
dioxus = { version = "0.7.9", features = ["web", "router"], optional = true }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"], optional = true }
dioxus-flow = { git = "https://github.com/AzurIce/dioxus-flow", optional = true }
gloo-net = { version = "0.6.0", optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
indexed-db = { version = "0.4", optional = true }
js-sys = { version = "0.3.83", optional = true }
raw-window-handle = { version = "0.6", optional = true }
urlencoding = { version = "2.1.3", optional = true }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = { version = "0.4.53", optional = true }
web-sys = { version = "0.3.83", features = [
    "Clipboard",
    "CanvasRenderingContext2d",
    "console",
    "Crypto",
    "Document",
    "Blob",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageData",
    "MouseEvent",
    "Navigator",
    "ErrorEvent",
    "MessageEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
    "Worker",
    "WebSocket",
], optional = true }
wgpu = { version = "29", features = ["webgl"], optional = true }
xiv-companion-data = { path = "crates/xiv-companion-data", default-features = false }
xiv-companion-render = { path = "crates/xiv-companion-render", default-features = false }

[dev-dependencies]
futures-executor = "0.3.32"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace]
members = ["crates/*", "xtask/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
