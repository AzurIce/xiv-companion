[package]
name = "dioxus-flow"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7.9", features = ["web"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.83", features = [
    "DomRect",
    "Element",
    "Event",
    "HtmlElement",
    "MouseEvent",
    "WheelEvent",
    "Window",
] }
